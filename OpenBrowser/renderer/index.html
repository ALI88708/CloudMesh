<!DOCTYPE html>
<html lang="ar" dir="ltr" data-theme="amoled" data-lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenBrowser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Window Buttons (TOP) -->
    <div id="titlebar">
      <div class="titlebar-drag"></div>
      <div class="titlebar-buttons">
        <button class="title-btn" id="btn-minimize" title="تصغير">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor"/></svg>
        </button>
        <button class="title-btn" id="btn-maximize" title="تكبير">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <button class="title-btn close-btn" id="btn-close" title="إغلاق">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>

    <!-- Tabs Bar -->
    <div id="tabs-bar">
      <div class="tabs-left">
        <div class="app-icon-small">●</div>
        <div id="tabs-container">
          <div class="tab active" data-tab-id="0">
            <span class="tab-title" data-i18n="newTab">تبويب جديد</span>
            <button class="tab-close" data-close="0">×</button>
          </div>
        </div>
      </div>
      <button class="tab-add" id="btn-add-tab" title="تبويب جديد">+</button>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
      <div class="nav-buttons">
        <button class="nav-btn" id="btn-back" title="رجوع">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 2L4 8L10 14" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <button class="nav-btn" id="btn-forward" title="أمام">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 2L12 8L6 14" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <button class="nav-btn" id="btn-reload" title="تحديث">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M13 8A5 5 0 1 1 8 3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 1L11 3L8 5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <button class="nav-btn" id="btn-home" title="الرئيسية">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8L8 2L14 8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M4 8V14H12V8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
      </div>

      <div class="address-bar-container">
        <div class="address-bar" id="address-bar">
          <span class="address-icon" id="address-icon">🔍</span>
          <input type="text" id="url-input" data-i18n-placeholder="urlPlaceholder" placeholder="اكتب الرابط أو البحث..." spellcheck="false" autocomplete="off">
          <button class="go-btn" id="btn-go">→</button>
        </div>
      </div>

      <div class="toolbar-actions">
        <button class="action-btn" id="btn-bookmark" title="إضافة إشارة مرجعية">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 2h10v12l-5-3-5 3V2z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
        <button class="action-btn" id="btn-downloads" title="التنزيلات" style="position:relative">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2V10M4 7L8 11L12 7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M2 13H14" stroke="currentColor" stroke-width="2"/></svg>
          <span id="dl-badge"></span>
        </button>
        <button class="action-btn" id="btn-incognito" title="التصفح الخفي">
          <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M3 8H13" stroke="currentColor" stroke-width="1.5"/><path d="M8 2C6 5 6 11 8 14" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M8 2C10 5 10 11 8 14" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </button>
        <button class="action-btn" id="btn-lang" title="اللغة">
          <span id="lang-label">عربي</span>
        </button>
        <button class="action-btn" id="btn-settings" title="الإعدادات">
          <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 1V3M8 13V15M1 8H3M13 8H15M3 3L5 5M11 11L13 13M13 3L11 5M5 11L3 13" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
    </div>

    <!-- شريط البحث داخل الصفحة - مخفي لين يضغط المستخدم Ctrl+F -->
    <div id="find-bar" class="find-bar">
      <input type="text" id="find-input" placeholder="بحث بالصفحة..." autocomplete="off">
      <span id="find-count">0/0</span>
      <button id="find-prev" title="السابق">▲</button>
      <button id="find-next" title="التالي">▼</button>
      <button id="find-close" title="إغلاق">×</button>
    </div>

    <!-- Content -->
    <div id="content-area">
      <div class="webview-wrapper active" data-tab-id="0"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
