<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    #cursor {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      transition: left 0.12s ease-out, top 0.12s ease-out;
      filter: drop-shadow(0 0 8px rgba(0, 136, 255, 0.9));
      z-index: 2147483647;
    }
    #cursor.no-transition {
      transition: none;
    }
    #click-ripple {
      position: fixed;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #0088ff;
      background: rgba(0, 136, 255, 0.25);
      pointer-events: none;
      display: none;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.35s ease-out, opacity 0.35s ease-out;
      z-index: 2147483646;
    }
  </style>
</head>
<body>
  <div id="cursor">
    <svg width="28" height="36" viewBox="0 0 28 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 2L2 30L9 23L16 34L20 32L13 21L22 21L2 2Z"
            fill="#0a0a0a"
            stroke="#0088ff"
            stroke-width="2.5"
            stroke-linejoin="round"/>
    </svg>
  </div>
  <div id="click-ripple"></div>
  <script>
    const cursor = document.getElementById('cursor');
    const ripple = document.getElementById('click-ripple');
    let curX = 0, curY = 0;

    window.api = {
      move(x, y, instant) {
        curX = x; curY = y;
        if (instant) cursor.classList.add('no-transition');
        else cursor.classList.remove('no-transition');
        cursor.style.left = x + 'px';
        cursor.style.top = y + 'px';
      },
      click(x, y) {
        const cx = x !== undefined ? x : curX;
        const cy = y !== undefined ? y : curY;
        cursor.style.left = cx + 'px';
        cursor.style.top = cy + 'px';
        cursor.classList.add('no-transition');

        ripple.style.left = cx + 'px';
        ripple.style.top = cy + 'px';
        ripple.style.display = 'block';
        ripple.style.transform = 'translate(-50%, -50%) scale(1)';
        ripple.style.opacity = '1';

        const svg = cursor.querySelector('svg');
        if (svg) { svg.style.transform = 'scale(0.8)'; setTimeout(() => svg.style.transform = 'scale(1)', 100); }

        setTimeout(() => {
          ripple.style.transform = 'translate(-50%, -50%) scale(2.5)';
          ripple.style.opacity = '0';
          setTimeout(() => { ripple.style.display = 'none'; }, 350);
        }, 120);
      },
      show() { cursor.style.display = 'block'; },
      hide() { cursor.style.display = 'none'; },
      pos() { return { x: curX, y: curY, visible: cursor.style.display !== 'none' }; }
    };
  </script>
</body>
</html>
