[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmesh"
version = "2.0.0"
description = "Unified multi-cloud resource manager — CLI tool connecting servers into one pool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MRSX PRO"}
]
keywords = ["cloud", "multi-cloud", "server", "cluster", "monitor", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "psutil>=5.9",
    "rich>=13.0",
    "cryptography>=41.0",
    "paramiko>=3.0",
    "pycryptodome>=3.20",
]

[project.scripts]
cm = "cloudmesh.main:main"

[project.urls]
Homepage = "https://github.com/MrAli88708/CloudMesh"
Repository = "https://github.com/MrAli88708/CloudMesh"
Issues = "https://github.com/MrAli88708/CloudMesh/issues"

[tool.setuptools]
packages = ["cloudmesh", "cloudmesh.core", "cloudmesh.node", "cloudmesh.tests"]

[tool.setuptools.package-data]
cloudmesh = ["data/*.json"]
