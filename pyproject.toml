[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmesh"
version = "4.0.0"
description = "Unified multi-cloud resource manager — CLI tool connecting servers into one pool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MRSX PRO"}
]
keywords = ["cloud", "multi-cloud", "server", "cluster", "monitor", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: BSD :: OpenBSD",
    "Operating System :: POSIX :: BSD :: NetBSD",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "psutil>=5.9",
    "rich>=13.0",
    # These two move together and cannot be split. cryptography relocated
    # TripleDES into `hazmat.decrepit` in 48.0.0, which is the algorithm
    # paramiko's transport still builds its cipher list from, so raising
    # cryptography under paramiko 3.4 raises at import. paramiko 5.0.0 is
    # also the first release past PYSEC-2026-2858 ("through 4.0.0"), and
    # cryptography 50.0.0 past PYSEC-2026-3552 -- together they take
    # `pip-audit` from 10 advisories to none.
    "cryptography>=50.0.0",
    "paramiko>=5.0.0",
    "pycryptodome>=3.20",
    "bcrypt>=4.0",
]

[project.scripts]
cm = "cloudmesh.main:main"

[project.urls]
Homepage = "https://github.com/ALI88708/CloudMesh"
Repository = "https://github.com/ALI88708/CloudMesh"
Issues = "https://github.com/ALI88708/CloudMesh/issues"

[tool.setuptools]
packages = ["cloudmesh", "cloudmesh.core", "cloudmesh.node", "cloudmesh.tests"]

[tool.setuptools.package-data]
cloudmesh = ["data/*.json"]
