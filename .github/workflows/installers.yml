name: Installers

# Proves the Linux and Windows installers actually work, on their own platform.
#
# This is deliberately separate from CI. CI tests the source tree; this installs
# from a checkout the way a user would and then asserts the result is usable:
# the `cm` console script exists, the runtime dependencies import, `cm --version`
# and `cm --help` succeed, and the node agent is in place.
#
# Neither installer could be verified before this existed, because both were
# interactive-only. Both now take a --yes / /Y scripted path and self-verify.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip shellcheck
          python -m pip install --upgrade pip

      # bash must be able to parse the script before anything else matters.
      - name: The installer must parse under bash
        run: |
          set -euo pipefail
          bash -n ./cm_for-linux.sh
          echo "[OK] cm_for-linux.sh parses"

      # `--yes` drives the scripted path; `bash <script>` is used rather than
      # `./cm.sh` so a lost executable bit cannot fail the job for the wrong
      # reason. A test asserts the executable bit is actually committed.
      - name: The installer must be committed executable
        run: |
          set -euo pipefail
          mode=$(git ls-files -s cm_for-linux.sh | cut -d' ' -f1)
          echo "git mode: $mode"
          if [ "$mode" != "100755" ]; then
            echo "::error file=cm_for-linux.sh::committed mode $mode; the documented 'chmod +x && ./cm.sh' flow depends on 100755"
            exit 1
          fi
          echo "[OK] cm_for-linux.sh is committed as 100755"

      - name: --help must not need a TTY
        run: |
          set -euo pipefail
          bash ./cm_for-linux.sh --help < /dev/null
          echo "[OK] --help works without a terminal"

      - name: Install from this checkout and verify
        run: |
          set -euo pipefail
          bash ./cm_for-linux.sh --yes --source="$GITHUB_WORKSPACE" < /dev/null

      - name: The installed cm must be on PATH and working
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          echo "--- which cm ---"
          which cm
          echo "--- cm --version ---"
          cm --version
          echo "--- cm --help (first lines) ---"
          cm --help | head -5
          test "${PIPESTATUS[0]}" -eq 0

      - name: Node agent, TLS material, and file layout
        run: |
          set -euo pipefail
          test -f "$HOME/.cloudmesh-node/cloudmesh_node.py"
          test -x "$HOME/.cloudmesh-node/start.sh"
          test -x "$HOME/.cloudmesh-node/stop.sh"
          test -x "$HOME/.cloudmesh-node/status.sh"
          # A 10-year self-signed cert, generated by the installer.
          test -f "$HOME/.cloudmesh-node/cert.pem"
          test -f "$HOME/.cloudmesh-node/key.pem"
          echo "[OK] node agent, lifecycle scripts, and TLS material present"

      - name: Key files are private
        run: |
          set -euo pipefail
          check_mode() {
            mode=$(stat -c '%a' "$1")
            case "$mode" in
              600|400) echo "[OK] $1 is $mode" ;;
              *) echo "::error file=$1::expected 600, found $mode"; return 1 ;;
            esac
          }
          check_mode "$HOME/.cloudmesh/project/cloudmesh/.secret.key"

      - name: The whole command surface answers --help
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python scripts/smoke_cli.py --cmd cm --jobs 8

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-install-log
          path: |
            ~/.cloudmesh/venv/pip-install.log
            /var/log/syslog
          retention-days: 7
          if-no-files-found: ignore

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Isolate the install so the job never touches the runner's real profile.
      - name: Prepare an isolated profile
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP 'cm-profile'
          New-Item -ItemType Directory -Force -Path (Join-Path $sandbox 'AppData\Local/Microsoft/WindowsApps') | Out-Null
          "SANDBOX=$sandbox" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: --help must not need a TTY
        shell: cmd
        run: cm_for-windows.bat /?

      - name: Install from this checkout and verify
        shell: cmd
        run: |
          set "USERPROFILE=%SANDBOX%"
          set "CM_SOURCE_DIR=%GITHUB_WORKSPACE%"
          set "CM_SKIP_NODE=0"
          cm_for-windows.bat /Y
          echo Installer exit code: %ERRORLEVEL%

      - name: The installed cm must be working
        shell: pwsh
        run: |
          $cm = Join-Path $env:SANDBOX 'CloudMesh\venv\Scripts\cm.exe'
          if (-not (Test-Path $cm)) { throw "cm.exe was not installed at $cm" }
          & $cm --version
          & $cm --help | Select-Object -First 5
          if ($LASTEXITCODE -ne 0) { throw "cm --help exited $LASTEXITCODE" }

      - name: core/__init__.py must survive the install
        shell: pwsh
        run: |
          # The installer used to blank this file with `echo. > ...`, which
          # removed every package re-export.
          $init = Join-Path $env:SANDBOX 'CloudMesh\project\cloudmesh\core\__init__.py'
          if (-not (Test-Path $init)) { throw "core/__init__.py is missing" }
          $size = (Get-Item $init).Length
          if ($size -lt 10) { throw "core/__init__.py was truncated to $size bytes" }
          "[OK] core/__init__.py intact ($size bytes)"

      - name: Node agent present
        shell: pwsh
        run: |
          $agent = Join-Path $env:SANDBOX '.cloudmesh-node\cloudmesh_node.py'
          if (-not (Test-Path $agent)) { throw "node agent missing at $agent" }
          "[OK] node agent installed"

      - name: The whole command surface answers --help
        shell: pwsh
        run: |
          $cmDir = Join-Path $env:SANDBOX 'CloudMesh\venv\Scripts'
          $env:PATH = "$cmDir;$env:PATH"
          python scripts/smoke_cli.py --cmd cm --jobs 8
          if ($LASTEXITCODE -ne 0) { throw "smoke_cli.py failed" }

      - name: Upload the installer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-log
          path: ${{ runner.temp }}\cm_install_log.txt
          retention-days: 7
          if-no-files-found: ignore

  installers-are-sound:
    name: Installer contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloudmesh/requirements.txt

      # Static checks that do not need a full install: a hand-written
      # dependency list goes stale, and a truncated package file breaks imports.
      - name: The installers cannot hard-code the dependency list
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, sys, pathlib
          pyproject = pathlib.Path("pyproject.toml").read_text()
          block = re.search(r"dependencies\s*=\s*\[(.*?)\]", pyproject, re.S).group(1)
          declared = set(re.findall(r'"([A-Za-z0-9_.-]+)\s*[><=]', block))
          print("declared:", sorted(declared))

          bat = pathlib.Path("cm_for-windows.bat").read_text()

          # Look at real command lines only. A naive `pip install a b` search also
          # matches log text such as `echo [FAIL] pip install failed 1`.
          lines = [
              ln.strip()
              for ln in bat.splitlines()
              if re.match(r'\s*"?%VENV_PYTHON%"?\s+-m\s+pip\s+install\s+(?!-)(?!["%])\S', ln)
          ]
          print("windows pip command lines:", lines)
          assert not lines, f"installer hard-codes a dependency list: {lines}"
          assert 'pip install --quiet "%PROJECT_DIR%"' in bat
          print("[OK] the Windows installer installs the project, not a pinned list")
          PY

      - name: The Windows installer must not blank core/__init__.py
        run: |
          set -euo pipefail
          if grep -nE '^\s*echo\.?\s*>\s*"%CLOUDMESH_DIR%\\core\\__init__\.py"' cm_for-windows.bat; then
            echo "::error file=cm_for-windows.bat::the installer overwrites core/__init__.py, removing every package re-export"
            exit 1
          fi
          echo "[OK] core/__init__.py is left alone"

      - name: Both installers expose a scripted path
        run: |
          set -euo pipefail
          grep -q 'NONINTERACTIVE' cm_for-linux.sh
          grep -q 'NONINTERACTIVE' cm_for-windows.bat
          grep -q 'verify_install' cm_for-linux.sh
          grep -q 'verify_install' cm_for-windows.bat
          echo "[OK] both installers support non-interactive use and self-verify"

      - name: Installer contract tests
        working-directory: cloudmesh
        run: python -m pytest tests/test_installers.py -q --no-header