name: BSD

on:
  workflow_dispatch:
  push:
    branches: [ feature/bsd-support ]

permissions:
  contents: read

concurrency:
  group: bsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD suite and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: FreeBSD suite and smoke test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y python311 py311-pip py311-psutil git
          run: |
            set -e
            # FreeBSD marks its python ports as externally managed; CI installs
            # into that interpreter on purpose, inside a throwaway VM.
            export PIP_BREAK_SYSTEM_PACKAGES=1
            python3.11 --version
            python3.11 -m pip install --upgrade pip
            python3.11 -m pip install -r cloudmesh/requirements.txt
            python3.11 -m pytest cloudmesh/tests -q
            sh scripts/bsd_e2e.sh
