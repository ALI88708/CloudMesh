name: Release

# Builds the distributable artifacts when a version tag is pushed and attaches
# them to the GitHub Release.
#
# PRs do not need this: ci.yml already proves the wheel builds, installs, and
# passes the command-surface smoke test. What happens here is only packaging
# the verified artifact and naming the release after the tag.

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v3.4.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # `ref` pins the build to the tag being released. A manual dispatch
      # passes the tag as an input, and a tag push resolves `github.ref` to
      # it, so both paths build the released commit rather than whatever
      # happens to be on the default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Metadata check
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*

      - name: Install the wheel and check the entry point
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .rel-venv
          # shellcheck disable=SC1091
          source .rel-venv/bin/activate 2>/dev/null || source .rel-venv/Scripts/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          cm --version
          python scripts/smoke_cli.py --cmd cm --jobs 8 --quiet
          echo "[OK] release artifact verified"

      - name: Generate SBOM
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          source .rel-venv/bin/activate
          python -m pip install --quiet cyclonedx-bom
          cyclonedx-py environment --output-file dist/sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 14

  publish:
    name: Attach artifacts to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The checkout has to come first. `actions/checkout` runs
      # `git clean -ffdx`, which deletes the untracked `artifacts/` directory
      # that `download-artifact` just wrote -- and the release then uploads
      # nothing. The v3.4.0 release shipped without a wheel because of this
      # ordering.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Only the Linux build is published. Both builds produce a wheel with
      # the same name, and `merge-multiple: true` extracts them into the
      # same directory at the same time -- the published wheel came out as
      # the first 331800 bytes of one file and the tail of the other, which
      # is a corrupt zip. The Windows build still earns its place: it
      # installs the wheel and walks the command surface, so the artifact
      # is proven to work on Windows without being published twice.
      - uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-latest
          path: artifacts

      - name: Check the artifacts are intact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m zipfile -t artifacts/*.whl
          tar -tzf artifacts/*.tar.gz > /dev/null
          echo "[OK] the wheel and the sdist are readable"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Written from inside the directory so the file names are bare:
          # the published checksum file has to work with a plain
          # `sha256sum -c SHA256SUMS` next to the downloaded assets.
          (cd artifacts && sha256sum *.whl *.tar.gz > SHA256SUMS)

      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*.whl

      - name: Work out the release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The release title drops the tag's leading "v": "CloudMesh
          # 4.1.2" reads better than "CloudMesh v4.1.2", and the earlier
          # releases were titled that way by hand.
          echo "title=CloudMesh ${TAG#v}" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<CMEOF'
            python3 scripts/release_notes.py "$TAG"
            echo 'CMEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.notes.outputs.tag, '-') }}
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/sbom.cdx.json